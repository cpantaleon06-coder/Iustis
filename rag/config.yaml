embeddings:
  # local: modelo multilingüe en el CPU, sin costo (se descarga de Hugging Face la primera vez)
  # voyage: API de Voyage AI (requiere VOYAGE_API_KEY)
  proveedor: local
  modelo: intfloat/multilingual-e5-base

recuperacion:
  k: 4          # artículos que pasan como contexto a la generación (acotado por el límite de tokens de Groq)
  rrf_k: 60     # constante estándar de Reciprocal Rank Fusion

verificacion:
  # Similitud coseno mínima del mejor artículo para contestar (embeddings locales multilingual-e5-base).
  # Calibrado el 2026-09-25 con tests/bench/calibracion_provisional.yaml (21/22 bien separadas;
  # dentro de módulos 0.843 a 0.873, fuera 0.799 a 0.843). Recalibrar con el banco oficial:
  #   python -m rag.calibrar --escribir
  umbral_similitud: 0.835
  umbral_calibrado: true
  # Una cita textual debe tener al menos estos caracteres (evita "citas" triviales)
  cita_min_caracteres: 20
