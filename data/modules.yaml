# Registro de módulos (un módulo = un cuerpo normativo con su propio corpus).
#
# Para agregar un módulo nuevo:
#   1. Extrae el texto del PDF oficial: python -m ingestion.extraer --pdf X.pdf --fuente <fuente> --tablas
#   2. Copia data/raw/_plantilla.meta.yaml como data/raw/<fuente>.meta.yaml y llénalo
#   3. Da de alta el módulo aquí abajo
#   4. python -m ingestion.ingest --modulo <id> && python -m rag.index --modulo <id>
#
# "area" puede ser una cadena o una lista. Áreas que reconoce el triaje:
#   transito, laboral, constitucional, civil, familiar, penal, mercantil
#
# ADVERTENCIA DE COMPETENCIA (importante que la revise un abogado): los códigos civil y
# penal federales NO rigen los asuntos locales. Una persona en la Ciudad de México que
# pregunta por un divorcio o un arrendamiento se rige por los códigos de la Ciudad de
# México, no por los federales. Mientras no se carguen los códigos locales, las respuestas
# de las áreas civil, familiar y penal pueden citar la norma equivocada para su caso.

modulos:
  transito_cdmx:
    nombre: "Tránsito en la Ciudad de México"
    area: transito
    activo: true
    fuentes:
      - reglamento_transito_cdmx

  laboral_despido:
    nombre: "Despido laboral"
    area: laboral
    activo: true
    calculadora: laboral   # usa backend/calculadora/parametros_laborales.yaml
    fuentes:
      - ley_federal_trabajo

  penal_federal:
    nombre: "Delitos y procedimiento penal (federal)"
    area: penal
    activo: true
    fuentes:
      - codigo_penal_federal
      - cnpp

  civil_familiar_federal:
    nombre: "Materia civil y familiar (federal)"
    area: [civil, familiar]
    activo: true
    fuentes:
      - codigo_civil_federal
      - cnpcf

  mercantil:
    nombre: "Materia mercantil"
    area: mercantil
    activo: true
    fuentes:
      - codigo_comercio
