# Instituciones generales (aplican a cualquier módulo).
#
# ESTOS DATOS NO ESTÁN VERIFICADOS POR EL EQUIPO. Se tomaron de los sitios oficiales
# indicados en "fuente" el 2026-09-25, pero nadie del equipo los ha confirmado todavía.
# Mientras "verificado" sea false, la respuesta muestra [PENDIENTE DE VERIFICACIÓN].
#
# Para verificar: abre la URL de "fuente", comprueba nombre, teléfono y dirección,
# corrige lo que haga falta y cambia "verificado" a true.
#
# El modelo NUNCA redacta estos datos: solo elige ids de este catálogo.
#
# Campos:
#   id          identificador interno
#   nombre      nombre oficial
#   cuando      en qué casos se recomienda (el modelo lo lee para elegir)
#   contacto    teléfono, dirección o sitio web oficial
#   tipo        emergencia | canalizacion (canalizacion = a dónde mandar cuando el asistente se abstiene)
#   fuente      URL oficial de donde salió el dato
#   verificado  true solo cuando alguien del equipo confirmó los datos en fuente oficial

instituciones:
  - id: emergencias
    nombre: "Número Nacional de Emergencias 911"
    cuando: "Peligro inmediato para la vida o la integridad, violencia en curso, accidente con lesionados, detención con uso de fuerza"
    contacto: "Llama al 911. Gratuito, las 24 horas, todos los días, desde cualquier teléfono."
    tipo: emergencia
    fuente: "https://www.gob.mx/911"
    verificado: false

  - id: defensoria_cdmx
    nombre: "Defensoría Pública de la Ciudad de México (Consejería Jurídica y de Servicios Legales)"
    cuando: "Orientación, asesoría y representación jurídica gratuita en materia civil, familiar, arrendamiento inmobiliario, mercantil, penal y justicia para adolescentes, para quien no puede pagar un abogado particular"
    contacto: "Consulta la oficina de tu alcaldía en https://www.cdmx.gob.mx/public/InformacionTramite.xhtml?idTramite=453 o llama a LOCATEL al 55 5658 1111"
    tipo: canalizacion
    fuente: "https://www.cdmx.gob.mx/public/InformacionTramite.xhtml?idTramite=453"
    verificado: false

  - id: locatel
    nombre: "LOCATEL Ciudad de México"
    cuando: "Orientación general sobre trámites y servicios del gobierno de la Ciudad de México, y para localizar un vehículo remitido a un depósito"
    contacto: "55 5658 1111, las 24 horas. Gratuito. https://locatel.cdmx.gob.mx"
    tipo: canalizacion
    fuente: "https://adip.cdmx.gob.mx/proyectos/locatel"
    verificado: false
