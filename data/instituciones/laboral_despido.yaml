# Instituciones del módulo laboral_despido. Mismo formato que general.yaml.
#
# PENDIENTE DE DECIDIR POR EL EQUIPO: cuándo corresponde el Centro federal y cuándo el
# Centro local de la Ciudad de México. El texto de "cuando" es una primera aproximación
# y conviene que un abogado lo revise, porque de eso depende a dónde se manda a la persona.

instituciones:
  - id: laboral_asesoria_gratuita
    nombre: "Procuraduría Federal de la Defensa del Trabajo (PROFEDET)"
    cuando: "Asesoría, acompañamiento en la conciliación y representación jurídica gratuita para personas trabajadoras en cualquier conflicto laboral o de seguridad social"
    contacto: "800 717 2942 o 800 911 7877, de lunes a viernes de 9:00 a 18:00 horas. Gratuito. https://www.gob.mx/profedet"
    tipo: canalizacion
    fuente: "https://www.profedet.gob.mx/micrositio/index.php/preguntas-frecuentes"
    fecha_consulta: "2026-09-25"
    verificado: true

  - id: laboral_conciliacion_cdmx
    nombre: "Centro de Conciliación Laboral de la Ciudad de México"
    cuando: "Iniciar la conciliación obligatoria antes de demandar, cuando el patrón es una empresa de competencia local en la Ciudad de México"
    contacto: "55 6283 1495 o 55 6283 1496, de lunes a viernes de 8:00 a 14:00 horas. Calle Dr. Andrade 45, Colonia Doctores, Alcaldía Cuauhtémoc. https://www.ccl.cdmx.gob.mx"
    tipo: canalizacion
    fuente: "https://www.ccl.cdmx.gob.mx/"
    fecha_consulta: "2026-09-25"
    verificado: true

  - id: laboral_conciliacion_federal
    nombre: "Centro Federal de Conciliación y Registro Laboral"
    # El correo y el sitio se confirmaron en gob.mx/cfcrl. El teléfono que circula
    # (55 8874 8600) no aparece en esa página, por eso no se incluye aquí; si el equipo
    # lo confirma, puede agregarlo al contacto.
    cuando: "Iniciar la conciliación obligatoria antes de demandar, cuando el conflicto es de competencia federal por el giro de la empresa"
    contacto: "atencionciudadana@centrolaboral.gob.mx. https://www.gob.mx/cfcrl"
    tipo: canalizacion
    fuente: "https://www.gob.mx/cfcrl"
    fecha_consulta: "2026-09-26"
    verificado: true
