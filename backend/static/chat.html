<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Iustis</title>
<meta name="description" content="Iustis da los Primeros Auxilios Legales y te ayuda a saber dónde acudir.">
<style>
  :root {
    --fondo: #efeae2; --panel: #ffffff; --texto: #111b21; --suave: #667781;
    --yo: #d9fdd3; --bot: #ffffff; --acento: #075e54; --acento-claro: #128c7e;
    --borde: #d1d7db; --cita: #f0f2f5;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --fondo: #0b141a; --panel: #202c33; --texto: #e9edef; --suave: #8696a0;
      --yo: #005c4b; --bot: #202c33; --acento: #075e54; --acento-claro: #00a884;
      --borde: #2a3942; --cita: #182229;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--fondo); color: var(--texto);
    height: 100dvh; display: flex; flex-direction: column;
  }
  header {
    background: var(--acento); color: #fff; padding: 12px 16px;
    display: flex; align-items: center; gap: 12px; flex-shrink: 0;
  }
  .marca { width: 38px; height: 38px; border-radius: 50%; background: var(--acento-claro);
           display: grid; place-items: center; font-weight: 700; font-size: 17px; flex-shrink: 0; }
  header h1 { margin: 0; font-size: 17px; font-weight: 600; }
  header p { margin: 1px 0 0; font-size: 12px; opacity: .85; }

  main { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 8px; }
  .burbuja {
    max-width: min(88%, 680px); padding: 8px 12px; border-radius: 8px;
    white-space: pre-wrap; overflow-wrap: anywhere; box-shadow: 0 1px 1px rgba(0,0,0,.08);
  }
  .yo { align-self: flex-end; background: var(--yo); }
  .bot { align-self: flex-start; background: var(--bot); }
  .bot strong { color: var(--acento-claro); }
  .estado { align-self: center; font-size: 12px; color: var(--suave); display: flex; gap: 6px; align-items: center; }
  .punto { width: 6px; height: 6px; border-radius: 50%; background: var(--suave); animation: latir 1.2s infinite; }
  .punto:nth-child(2) { animation-delay: .2s; } .punto:nth-child(3) { animation-delay: .4s; }
  @keyframes latir { 0%, 60%, 100% { opacity: .25; } 30% { opacity: 1; } }

  /* Ejemplos con los que arrancar la conversación */
  #ejemplos { display: flex; flex-wrap: wrap; gap: 8px; padding: 0 16px 12px; flex-shrink: 0; }
  #ejemplos button {
    background: var(--panel); color: var(--texto); border: 1px solid var(--borde);
    border-radius: 16px; padding: 7px 13px; font: inherit; font-size: 13px; cursor: pointer;
  }
  #ejemplos button:hover { border-color: var(--acento-claro); color: var(--acento-claro); }

  form { display: flex; gap: 8px; padding: 10px 12px; background: var(--panel);
         border-top: 1px solid var(--borde); flex-shrink: 0; }
  textarea {
    flex: 1; resize: none; border: 1px solid var(--borde); border-radius: 20px;
    padding: 9px 14px; font: inherit; background: var(--fondo); color: var(--texto); max-height: 120px;
  }
  button.icono {
    border: 0; border-radius: 50%; width: 42px; height: 42px; background: var(--acento-claro);
    color: #fff; font-size: 17px; cursor: pointer; flex-shrink: 0;
  }
  button.icono:disabled { opacity: .5; cursor: default; }
  #mic.grabando { background: #d93025; animation: latir 1s infinite; }
  footer { text-align: center; font-size: 11px; color: var(--suave); padding: 0 16px 8px; flex-shrink: 0; }
</style>
</head>
<body>
<header>
  <div class="marca" aria-hidden="true">Iu</div>
  <div>
    <h1>Iustis</h1>
    <p>Da los Primeros Auxilios Legales y te ayuda a saber dónde acudir</p>
  </div>
</header>

<main id="mensajes" aria-live="polite"></main>

<div id="ejemplos"></div>

<form id="form">
  <textarea id="entrada" rows="1" maxlength="2000" placeholder="Cuéntame qué te pasó" aria-label="Mensaje"></textarea>
  <button type="button" class="icono" id="mic" title="Nota de voz" aria-label="Grabar nota de voz">🎤</button>
  <button type="submit" class="icono" id="enviar" title="Enviar" aria-label="Enviar">➤</button>
</form>
<footer>Orientación general basada en la ley citada. No sustituye la asesoría de un abogado.</footer>

<script>
  const mensajes = document.getElementById("mensajes");
  const entrada = document.getElementById("entrada");
  const cajaEjemplos = document.getElementById("ejemplos");
  const botones = [document.getElementById("enviar"), document.getElementById("mic")];

  const BIENVENIDA = "Hola, soy *Iustis*. Te doy los primeros auxilios legales y te ayudo a saber a dónde acudir.\n\n" +
    "Cuéntame en tus palabras qué te pasó y te digo qué derechos tienes, qué hacer y a dónde acudir.";

  const EJEMPLOS = [
    "Me corrieron del trabajo y no me dieron nada por escrito",
    "Se llevaron mi carro al corralón, ¿cómo lo recupero?",
    "Me multaron por estacionarme en la banqueta",
    "Llevo 6 años y me despidieron, ¿cuánto me toca?",
  ];

  function nuevaSesion() {
    const s = (crypto.randomUUID ? crypto.randomUUID() : String(Math.random()).slice(2) + Date.now());
    try { sessionStorage.setItem("sesion", s); } catch (e) {}
    return s;
  }
  let sesion;
  try { sesion = sessionStorage.getItem("sesion"); } catch (e) {}
  sesion = sesion || nuevaSesion();

  // Formato de WhatsApp: *negritas* y _cursivas_ (el texto se escapa antes)
  function formato(texto) {
    const esc = texto.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    return esc.replace(/\*([^*\n]+)\*/g, "<strong>$1</strong>")
              .replace(/(^|[\s(])_([^_\n]+)_/g, "$1<em>$2</em>");
  }
  function agregar(texto, clase) {
    const div = document.createElement("div");
    div.className = "burbuja " + clase;
    if (clase === "bot") div.innerHTML = formato(texto); else div.textContent = texto;
    mensajes.appendChild(div);
    mensajes.scrollTop = mensajes.scrollHeight;
    return div;
  }
  function esperando() {
    const div = document.createElement("div");
    div.className = "estado";
    div.innerHTML = "<span class='punto'></span><span class='punto'></span><span class='punto'></span>" +
                    "<span>Buscando el artículo que aplica…</span>";
    mensajes.appendChild(div);
    mensajes.scrollTop = mensajes.scrollHeight;
    return div;
  }
  function ocupado(si) { botones.forEach(b => b.disabled = si); }

  function pintarEjemplos() {
    cajaEjemplos.innerHTML = "";
    EJEMPLOS.forEach(texto => {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = texto;
      b.addEventListener("click", () => { enviarTexto(texto); });
      cajaEjemplos.appendChild(b);
    });
  }

  async function responder(promesa) {
    ocupado(true);
    cajaEjemplos.innerHTML = "";   // los ejemplos solo sirven para arrancar
    const cargando = esperando();
    try {
      const r = await promesa;
      const datos = await r.json().catch(() => ({}));
      cargando.remove();
      if (!r.ok) { agregar(datos.detail || "El servicio no está disponible.", "bot"); return; }
      if (datos.transcripcion) agregar("🎤 " + datos.transcripcion, "yo");
      agregar(datos.texto, "bot");
    } catch (e) {
      cargando.remove();
      agregar("No me pude conectar. Intenta de nuevo.", "bot");
    } finally { ocupado(false); }
  }

  function enviarTexto(texto) {
    texto = (texto || "").trim();
    if (!texto) return;
    agregar(texto, "yo");
    entrada.value = "";
    responder(fetch("/api/chat", {
      method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({sesion, mensaje: texto}),
    }));
  }

  document.getElementById("form").addEventListener("submit", ev => {
    ev.preventDefault();
    enviarTexto(entrada.value);
  });
  entrada.addEventListener("keydown", ev => {
    if (ev.key === "Enter" && !ev.shiftKey) { ev.preventDefault(); document.getElementById("form").requestSubmit(); }
  });

  // Nota de voz
  const mic = document.getElementById("mic");
  let grabadora = null, trozos = [];
  mic.addEventListener("click", async () => {
    if (grabadora && grabadora.state === "recording") { grabadora.stop(); return; }
    try {
      const flujo = await navigator.mediaDevices.getUserMedia({audio: true});
      grabadora = new MediaRecorder(flujo);
      trozos = [];
      grabadora.ondataavailable = e => trozos.push(e.data);
      grabadora.onstop = () => {
        flujo.getTracks().forEach(t => t.stop());
        mic.classList.remove("grabando");
        const tipo = (grabadora.mimeType || "audio/webm").split(";")[0];
        const datos = new FormData();
        datos.append("sesion", sesion);
        datos.append("audio", new Blob(trozos, {type: tipo}), "nota." + (tipo.includes("ogg") ? "ogg" : "webm"));
        responder(fetch("/api/chat/voz", {method: "POST", body: datos}));
      };
      grabadora.start();
      mic.classList.add("grabando");
    } catch (e) {
      agregar("No tengo permiso para usar el micrófono. Puedes escribir tu caso.", "bot");
    }
  });

  agregar(BIENVENIDA, "bot");
  pintarEjemplos();
</script>
</body>
</html>
