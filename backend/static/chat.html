<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Iustis</title>
<style>
  :root {
    --fondo: #efeae2; --panel: #ffffff; --texto: #111b21; --suave: #667781;
    --yo: #d9fdd3; --bot: #ffffff; --acento: #008069; --borde: #d1d7db;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --fondo: #0b141a; --panel: #202c33; --texto: #e9edef; --suave: #8696a0;
      --yo: #005c4b; --bot: #202c33; --acento: #00a884; --borde: #2a3942;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
         background: var(--fondo); color: var(--texto); height: 100dvh; display: flex; flex-direction: column; }
  header { background: var(--acento); color: #fff; padding: 12px 16px; }
  header h1 { margin: 0; font-size: 17px; }
  header p { margin: 2px 0 0; font-size: 12px; opacity: .85; }
  #mensajes { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 8px; }
  .burbuja { max-width: min(85%, 640px); padding: 8px 12px; border-radius: 8px; white-space: pre-wrap;
             overflow-wrap: anywhere; box-shadow: 0 1px 1px rgba(0,0,0,.08); }
  .yo { align-self: flex-end; background: var(--yo); }
  .bot { align-self: flex-start; background: var(--bot); }
  .estado { align-self: center; font-size: 12px; color: var(--suave); }
  form { display: flex; gap: 8px; padding: 10px 12px; background: var(--panel); border-top: 1px solid var(--borde); }
  textarea { flex: 1; resize: none; border: 1px solid var(--borde); border-radius: 20px; padding: 9px 14px;
             font: inherit; background: var(--fondo); color: var(--texto); max-height: 120px; }
  button { border: 0; border-radius: 50%; width: 42px; height: 42px; background: var(--acento); color: #fff;
           font-size: 18px; cursor: pointer; flex-shrink: 0; }
  button:disabled { opacity: .5; cursor: default; }
  #mic.grabando { background: #d93025; }
</style>
</head>
<body>
<header>
  <h1>Iustis</h1>
  <p>Iustis da los Primeros Auxilios Legales y te ayuda a saber dónde acudir</p>
</header>
<main id="mensajes" aria-live="polite"></main>
<form id="form">
  <textarea id="entrada" rows="1" maxlength="2000" placeholder="Cuéntame qué te pasó" aria-label="Mensaje"></textarea>
  <button type="button" id="mic" title="Nota de voz" aria-label="Grabar nota de voz">🎤</button>
  <button type="submit" id="enviar" title="Enviar" aria-label="Enviar">➤</button>
</form>
<script>
  const mensajes = document.getElementById("mensajes");
  const entrada = document.getElementById("entrada");
  const botones = [document.getElementById("enviar"), document.getElementById("mic")];

  function nuevaSesion() {
    const s = (crypto.randomUUID ? crypto.randomUUID() : String(Math.random()).slice(2) + Date.now());
    try { sessionStorage.setItem("sesion", s); } catch (e) {}
    return s;
  }
  let sesion;
  try { sesion = sessionStorage.getItem("sesion"); } catch (e) {}
  sesion = sesion || nuevaSesion();

  // Formato de WhatsApp: *negritas* y _cursivas_ (el texto se escapa antes)
  function formato(texto) {
    const esc = texto.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    return esc.replace(/\*([^*\n]+)\*/g, "<strong>$1</strong>").replace(/(^|[\s(])_([^_\n]+)_/g, "$1<em>$2</em>");
  }
  function agregar(texto, clase) {
    const div = document.createElement("div");
    div.className = "burbuja " + clase;
    if (clase === "bot") div.innerHTML = formato(texto); else div.textContent = texto;
    mensajes.appendChild(div);
    mensajes.scrollTop = mensajes.scrollHeight;
    return div;
  }
  function estado(texto) {
    const div = document.createElement("div");
    div.className = "estado";
    div.textContent = texto;
    mensajes.appendChild(div);
    mensajes.scrollTop = mensajes.scrollHeight;
    return div;
  }
  function ocupado(si) { botones.forEach(b => b.disabled = si); }

  async function responder(promesa) {
    ocupado(true);
    const esperando = estado("Revisando la ley aplicable…");
    try {
      const r = await promesa;
      const datos = await r.json().catch(() => ({}));
      esperando.remove();
      if (!r.ok) { agregar(datos.detail || "El servicio no está disponible.", "bot"); return; }
      if (datos.transcripcion) agregar("🎤 " + datos.transcripcion, "yo");
      agregar(datos.texto, "bot");
    } catch (e) {
      esperando.remove();
      agregar("No me pude conectar. Intenta de nuevo.", "bot");
    } finally { ocupado(false); }
  }

  document.getElementById("form").addEventListener("submit", ev => {
    ev.preventDefault();
    const texto = entrada.value.trim();
    if (!texto) return;
    agregar(texto, "yo");
    entrada.value = "";
    responder(fetch("/api/chat", {
      method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({sesion, mensaje: texto}),
    }));
  });
  entrada.addEventListener("keydown", ev => {
    if (ev.key === "Enter" && !ev.shiftKey) { ev.preventDefault(); document.getElementById("form").requestSubmit(); }
  });

  // Nota de voz
  const mic = document.getElementById("mic");
  let grabadora = null, trozos = [];
  mic.addEventListener("click", async () => {
    if (grabadora && grabadora.state === "recording") { grabadora.stop(); return; }
    try {
      const flujo = await navigator.mediaDevices.getUserMedia({audio: true});
      grabadora = new MediaRecorder(flujo);
      trozos = [];
      grabadora.ondataavailable = e => trozos.push(e.data);
      grabadora.onstop = () => {
        flujo.getTracks().forEach(t => t.stop());
        mic.classList.remove("grabando");
        const tipo = (grabadora.mimeType || "audio/webm").split(";")[0];
        const datos = new FormData();
        datos.append("sesion", sesion);
        datos.append("audio", new Blob(trozos, {type: tipo}), "nota." + (tipo.includes("ogg") ? "ogg" : "webm"));
        responder(fetch("/api/chat/voz", {method: "POST", body: datos}));
      };
      grabadora.start();
      mic.classList.add("grabando");
    } catch (e) {
      agregar("No tengo permiso para usar el micrófono. Puedes escribir tu caso.", "bot");
    }
  });

  agregar("Hola, soy *Iustis*. Te doy los primeros auxilios legales y te ayudo a saber a dónde acudir.

Cuéntame en tus palabras qué te pasó y te digo qué derechos tienes, qué hacer y a dónde acudir.", "bot");
</script>
</body>
</html>
