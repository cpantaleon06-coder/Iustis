# Banco de pruebas del asistente.
#
# QUIÉN LO ESCRIBIÓ Y QUÉ MIDE (importante): esta primera versión la redactó el asistente
# de desarrollo, no un abogado. Las citas esperadas se eligieron leyendo los artículos del
# corpus, pero siguen siendo UNA LECTURA. Por eso, tal como está, el banco mide si el
# sistema coincide con esa lectura, no si coincide con la de un abogado.
#
# QUÉ DEBE HACER EL EQUIPO: revisar pregunta por pregunta si "citas_esperadas" es el
# artículo que ustedes citarían. Cambiar lo que haga falta. A partir de ahí el banco sí
# mide calidad jurídica y sirve para calibrar el umbral.
#
# Uso:
#   python -m tests.bench.run_bench --validar     revisa el banco sin llamar a ningún modelo
#   python -m tests.bench.run_bench --comparar    corre todo y compara con la corrida anterior
#   python -m rag.calibrar --escribir             recalibra el umbral de abstención con este banco
#
# Campos:
#   id               identificador corto único
#   modulo           id del módulo en data/modules.yaml, o null si no pertenece a ninguno
#   pregunta         tal como la escribiría una persona por WhatsApp
#   esperado         responder | abstenerse
#   citas_esperadas  ids de artículo; cuenta como correcta si cita AL MENOS UNO
#   seguimiento      opcional: lo que contestaría la persona si el asistente le pide un dato
#   notas            opcional
#
# Las preguntas marcadas con "notas: recuperación falla hoy" son las que el sistema no
# resuelve bien todavía: se dejaron a propósito para que se noten las mejoras.

preguntas:

  # ---------------- Tránsito CDMX ----------------

