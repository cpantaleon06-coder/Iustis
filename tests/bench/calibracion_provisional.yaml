# SET PROVISIONAL DE CALIBRACIÓN (no es el banco oficial).
#
# Lo redactó el asistente de desarrollo solo para fijar un umbral de abstención inicial
# mientras el equipo escribe tests/bench/preguntas.yaml. No contiene datos legales: solo
# consultas de usuario y si el sistema debería intentar responder (hay un módulo que
# cubre el tema) o abstenerse (el tema no está en ningún módulo cargado).
#
# Uso:  python -m rag.calibrar --banco tests/bench/calibracion_provisional.yaml
# Cuando exista el banco oficial, recalibrar con él.

